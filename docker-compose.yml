services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./storage:/app/storage"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: railmadad
      POSTGRES_USER: railmadad
      POSTGRES_PASSWORD: railmadad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railmadad -d railmadad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
